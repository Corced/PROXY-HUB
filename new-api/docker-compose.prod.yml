version: "3.9"

# Production overrides — DO NOT USE FOR DEVELOPMENT
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  # Pin images to specific versions in production
  postgres:
    image: postgres:16-alpine
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G
    ports: []
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  redis:
    image: redis:7-alpine
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 512M
    ports: []
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # Remove all port exposure except Caddy in production
  9router:
    ports: []
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  bot:
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  discord-gate:
    image: ${NEW_API_IMAGE:-your-registry/discord-gate:v1.0.0}
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  new-api:
    image: ${NEW_API_IMAGE:-your-registry/new-api:v1.0.0}
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  caddy:
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  bridge:
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"