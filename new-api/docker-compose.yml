services:
  caddy:
    image: caddy:2
    container_name: caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - new-api
    networks:
      - new-api-network

  new-api:
    build: .                      # builds from YOUR code in this folder
    container_name: new-api
    restart: always
    command: --log-dir /app/logs
    expose:
      - "3000"
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    environment:
      - SQL_DSN=postgresql://root:${DB_PASSWORD}@postgres:5432/new-api
      - REDIS_CONN_STRING=redis://:${REDIS_PASSWORD}@redis:6379
      - SESSION_SECRET=${SESSION_SECRET}
      - TZ=Asia/Jakarta
      - ERROR_LOG_ENABLED=true
      - BATCH_UPDATE_ENABLED=true
      - NODE_NAME=new-api-node-1
      - STREAMING_TIMEOUT=300
    depends_on:
      - redis
      - postgres
      - 9router
    networks:
      - new-api-network

  9router:
    image: decolua/9router:latest
    container_name: 9router
    restart: always
    environment:
      - NEXT_PUBLIC_BASE_URL=http://localhost:20128
      - INITIAL_PASSWORD=${ROUTER_PASSWORD}
    volumes:
      - ./data-9router:/app/data   # your backed-up login
    ports:
      - "127.0.0.1:20128:20128"
    networks:
      - new-api-network

  bridge:
    build: ../bridge
    container_name: bridge
    restart: always
    environment:
      - ROUTER_URL=http://9router:20128
      - ROUTER_PASSWORD=${ROUTER_PASSWORD}
    depends_on:
      - 9router
    networks:
      - new-api-network

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    networks:
      - new-api-network

  postgres:
    image: postgres:15
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: new-api
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - new-api-network

volumes:
  pg_data:
  caddy_data:
  caddy_config:

networks:
  new-api-network:
    driver: bridge