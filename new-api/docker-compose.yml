version: "3.9"

services:
  # ── INFRASTRUCTURE ────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-new-api}
      POSTGRES_USER: ${POSTGRES_USER:-root}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-root}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --protected-mode yes
    volumes:
      - redis_data:/data
    networks: [internal]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── DISCORD GATE SERVICES ─────────────────────────────────
  bot:
    build:
      context: .
      dockerfile: packages/bot/Dockerfile
    container_name: bot
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
    networks: [internal]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:${BOT_PORT}/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  discord-gate:
    build:
      context: .
      dockerfile: packages/discord-gate/Dockerfile
    container_name: discord-gate
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      bot:
        condition: service_started
    networks: [proxy, internal]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:${DISCORD_GATE_PORT}/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── PROXY-HUB SERVICES ────────────────────────────────────
  new-api:
    build: .
    container_name: new-api
    env_file: .env
    entrypoint: ["/bin/sh", "-c", "/app/scripts/check-defaults.sh && /app/new-api"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      discord-gate:
        condition: service_healthy
    networks: [proxy, internal]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/status"]
      interval: 15s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:latest
    container_name: caddy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
    depends_on:
      new-api:
        condition: service_healthy
      discord-gate:
        condition: service_healthy
    networks: [proxy]
    restart: unless-stopped

  # ── EXISTING PROXY-HUB SERVICES ───────────────────────────
  9router:
    image: decolua/9router:latest
    container_name: 9router
    restart: always
    environment:
      - NEXT_PUBLIC_BASE_URL=http://localhost:20128
      - INITIAL_PASSWORD=${ROUTER_PASSWORD}
    volumes:
      - ./data-9router:/app/data
    ports:
      - "127.0.0.1:20128:20128"
    networks:
      - internal

  bridge:
    build: ../bridge
    container_name: bridge
    restart: always
    environment:
      - ROUTER_URL=http://9router:20128
      - ROUTER_PASSWORD=${ROUTER_PASSWORD}
    depends_on:
      - 9router
    networks:
      - proxy
      - internal

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
  caddy_logs:

networks:
  proxy:
    driver: bridge
  internal:
    driver: bridge
    internal: true